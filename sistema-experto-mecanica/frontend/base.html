<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánica Experta | Sistema Experto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* =========================================================
           MECÁNICA EXPERTA — Estilos globales
           ========================================================= */
        :root {
            --navy-900: #07111f;
            --navy-800: #0b192c;
            --navy-700: #1a2c42;
            --navy-600: #243b55;
            --primary: #0d6efd;
            --primary-soft: rgba(13, 110, 253, 0.1);
            --primary-glow: rgba(13, 110, 253, 0.35);
            --bg-app: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #0f1b2d;
            --text-muted: #6b7a90;
            --border-soft: #e6ebf2;
            --sidebar-w: 270px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-card: 0 1px 2px rgba(11, 25, 44, 0.04), 0 16px 40px -14px rgba(11, 25, 44, 0.2);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(7, 17, 31, 0.18);
            position: relative;
            z-index: 2;
        }

        .sidebar-brand {
            padding: 26px 22px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(135deg, #3b8bff 0%, var(--primary) 100%);
            border-radius: 13px;
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.02rem;
            line-height: 1.15;
            letter-spacing: 0.04em;
        }

        .brand-subtitle {
            display: block;
            margin-top: 4px;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: #7e8da3;
        }

        .sidebar-menu {
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-label {
            padding: 0 12px 8px;
            font-size: 0.66rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #52627a;
        }

        .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            color: #a0aec0;
            font-size: 0.93rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.25s var(--ease), background-color 0.25s var(--ease);
        }

        .nav-link i {
            font-size: 1.1rem;
            transition: transform 0.25s var(--ease);
        }

        .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link:hover i { transform: translateX(2px) scale(1.08); }

        .nav-link.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(13, 110, 253, 0.22) 0%, rgba(26, 44, 66, 0.9) 70%);
        }

        .nav-link.active::before {
            content: "";
            position: absolute;
            left: -12px;
            top: 10px;
            bottom: 10px;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .nav-link.active i { color: #5ea1ff; }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 22px;
            font-size: 0.72rem;
            color: #52627a;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ---------- CONTENIDO PRINCIPAL ---------- */
        .main-content {
            flex-grow: 1;
            min-width: 0;
            padding: 32px 48px;
            overflow-y: auto;
            background:
                radial-gradient(900px 380px at 85% -10%, rgba(13, 110, 253, 0.07), transparent 70%),
                var(--bg-app);
        }

        .main-content::-webkit-scrollbar { width: 10px; }
        .main-content::-webkit-scrollbar-thumb {
            background: #c3ccd9;
            border-radius: 10px;
            border: 2px solid var(--bg-app);
        }
        .main-content::-webkit-scrollbar-thumb:hover { background: #a3afc0; }

        /* ---------- COMPONENTES REUTILIZABLES ---------- */
        .app-card {
            position: relative;
            max-width: 860px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            animation: fadeUp 0.6s var(--ease) both;
        }

        .page-title {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .page-title::before {
            content: "";
            width: 26px;
            height: 2px;
            border-radius: 2px;
            background: var(--primary);
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-soft);
            border: 1px solid rgba(13, 110, 253, 0.2);
            border-radius: 999px;
        }

        .version-badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22);
        }

        /* ---------- VISTA: ACERCA DE ---------- */
        .about-wrap {
            max-width: 1080px;
            margin: 0 auto;
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
        }

        .about-card {
            width: 100%;
            max-width: none;
            display: grid;
            grid-template-columns: 340px 1fr;
        }

        /* Panel izquierdo (marca) */
        .about-brand {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 32px;
            color: #fff;
            overflow: hidden;
            background:
                radial-gradient(420px 300px at 50% 0%, rgba(13, 110, 253, 0.38), transparent 70%),
                linear-gradient(160deg, var(--navy-700) 0%, var(--navy-800) 55%, var(--navy-900) 100%);
        }

        .about-brand::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 32px 32px;
            -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
                    mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
        }

        .about-brand > * { position: relative; }

        .about-hero-icon {
            position: relative;
            width: 112px;
            height: 112px;
            margin-bottom: 30px;
            display: grid;
            place-items: center;
            font-size: 3.2rem;
            color: #5ea1ff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(13, 110, 253, 0.35), inset 0 0 24px rgba(13, 110, 253, 0.15);
        }

        .about-hero-icon::before,
        .about-hero-icon::after {
            content: "";
            position: absolute;
            border-radius: 50%;
        }
        .about-hero-icon::before { inset: -12px; border: 1px dashed rgba(94, 161, 255, 0.35); animation: spin 40s linear infinite; }
        .about-hero-icon::after  { inset: -28px; border: 1px solid rgba(255, 255, 255, 0.06); }

        .about-hero-icon i { transition: transform 0.8s var(--ease); }
        .about-hero-icon:hover i { transform: rotate(180deg) scale(1.06); }

        .about-name {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: 0.06em;
            color: #fff;
            margin: 0 0 16px;
        }

        .about-brand .version-badge {
            color: #cfe1ff;
            background: rgba(13, 110, 253, 0.22);
            border-color: rgba(94, 161, 255, 0.35);
        }

        .about-tagline {
            margin: 18px 0 0;
            font-size: 0.82rem;
            color: #8fa3bf;
            letter-spacing: 0.02em;
        }

        /* Panel derecho (información) */
        .about-info {
            padding: 44px 48px 30px;
            display: flex;
            flex-direction: column;
        }

        .about-heading {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--navy-800);
            margin: 14px 0 12px;
        }

        .about-desc {
            font-size: 0.98rem;
            line-height: 1.7;
            color: var(--text-muted);
            margin: 0;
        }

        .feature-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .feature-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--navy-700);
            background: #f7f9fc;
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            transition: all 0.25s var(--ease);
        }

        .feature-chip i { color: var(--primary); }

        .feature-chip:hover {
            transform: translateY(-2px);
            background: #fff;
            border-color: rgba(13, 110, 253, 0.35);
            box-shadow: 0 8px 18px -8px var(--primary-glow);
        }

        .info-list {
            display: grid;
            gap: 10px;
            margin-top: 26px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: #f9fbfd;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
        }

        .info-item:hover {
            transform: translateX(3px);
            border-color: rgba(13, 110, 253, 0.3);
            box-shadow: 0 10px 22px -14px var(--primary-glow);
        }

        .info-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            color: var(--primary);
            background: var(--primary-soft);
            border-radius: 11px;
        }

        .info-label {
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--navy-800);
            line-height: 1.35;
        }

        .info-value small {
            font-weight: 400;
            color: var(--text-muted);
        }

        .about-foot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
            padding-top: 16px;
            font-size: 0.76rem;
            color: #8996aa;
            border-top: 1px solid var(--border-soft);
        }

        /* ---------- VISTA: INICIO ---------- */
        .home {
            width: 100%;
            max-width: none;
            margin: 0;
            animation: fadeUp 0.6s var(--ease) both;
        }

        /* Hero */
        .home-hero {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 220px;
            align-items: center;
            gap: 24px;
            padding: 36px 44px;
            border-radius: var(--radius-lg);
            color: #fff;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            background:
                radial-gradient(520px 320px at 100% 0%, rgba(13, 110, 253, 0.4), transparent 70%),
                linear-gradient(135deg, var(--navy-700) 0%, var(--navy-800) 55%, var(--navy-900) 100%);
        }

        .home-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 100%);
                    mask-image: linear-gradient(90deg, transparent 20%, #000 100%);
        }

        .home-hero > * { position: relative; }

        .home-hero .page-title { color: #7fb4ff; }
        .home-hero .page-title::before { background: #7fb4ff; }

        .home-title {
            font-size: clamp(2rem, 3.4vw, 2.7rem);
            font-weight: 800;
            letter-spacing: -0.01em;
            margin: 12px 0 6px;
            color: #fff;
        }

        .home-subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: #9fb4d0;
            margin-bottom: 14px;
        }

        .home-lead {
            max-width: 560px;
            font-size: 0.98rem;
            line-height: 1.7;
            color: #c3d0e2;
            margin: 0;
        }

        .home-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

        .home-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 13px;
            font-size: 0.76rem;
            font-weight: 500;
            color: #dbe7fa;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }
        .home-pill i { color: #7fb4ff; }

        .home-car {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto;
            display: grid;
            place-items: center;
            font-size: 5rem;
            color: #5ea1ff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(13, 110, 253, 0.35), inset 0 0 30px rgba(13, 110, 253, 0.15);
        }
        .home-car::before {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 1px dashed rgba(94, 161, 255, 0.35);
            animation: spin 45s linear infinite;
        }

        /* Sección de síntomas */
        .home-section-head { text-align: center; margin: 34px 0 20px; }
        .home-section-head h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--navy-800);
            margin: 8px 0 0;
        }
        .home-section-head .page-title::before { display: none; }

        .symptom-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        .symptom-card {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 26px 24px 22px;
            text-decoration: none;
            color: inherit;
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            box-shadow: 0 1px 2px rgba(11, 25, 44, 0.04), 0 8px 24px -14px rgba(11, 25, 44, 0.16);
            overflow: hidden;
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
        }

        .symptom-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #5ea1ff);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--ease);
        }

        .symptom-card:hover {
            transform: translateY(-6px);
            border-color: rgba(13, 110, 253, 0.35);
            box-shadow: 0 18px 40px -16px var(--primary-glow);
            color: inherit;
        }
        .symptom-card:hover::before { transform: scaleX(1); }

        .symptom-num {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #b6c1d1;
        }

        .symptom-icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            font-size: 1.7rem;
            color: var(--primary);
            background: var(--primary-soft);
            border-radius: 16px;
            margin-bottom: 18px;
            transition: all 0.3s var(--ease);
        }

        .symptom-card:hover .symptom-icon {
            color: #fff;
            background: linear-gradient(135deg, #3b8bff, var(--primary));
            box-shadow: 0 10px 22px -8px var(--primary-glow);
            transform: scale(1.06) rotate(-4deg);
        }

        .symptom-title {
            font-size: 1.08rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--navy-800);
            margin: 0 0 8px;
        }

        .symptom-desc {
            font-size: 0.87rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0 0 22px;
        }

        .symptom-cta {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--primary);
            background: #f4f8ff;
            border: 1px solid rgba(13, 110, 253, 0.2);
            border-radius: 999px;
            transition: all 0.3s var(--ease);
        }
        .symptom-cta i { transition: transform 0.3s var(--ease); }

        .symptom-card:hover .symptom-cta {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }
        .symptom-card:hover .symptom-cta i { transform: translateX(4px); }

        /* Banner OBD-II */
        .obd-banner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 24px;
            padding: 22px 28px;
            border-radius: var(--radius-lg);
            color: #fff;
            overflow: hidden;
            background:
                radial-gradient(380px 200px at 0% 50%, rgba(13, 110, 253, 0.28), transparent 70%),
                linear-gradient(135deg, var(--navy-800), var(--navy-900));
            box-shadow: var(--shadow-card);
        }

        .obd-info { display: flex; align-items: center; gap: 18px; }

        .obd-icon {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            color: #7fb4ff;
            background: rgba(13, 110, 253, 0.18);
            border: 1px solid rgba(94, 161, 255, 0.3);
            border-radius: 14px;
        }

        .obd-title { font-size: 1.08rem; font-weight: 700; margin: 0 0 3px; }
        .obd-text  { font-size: 0.86rem; color: #94a7c2; margin: 0; }

        .obd-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #3b8bff, var(--primary));
            border-radius: 999px;
            box-shadow: 0 10px 24px -8px var(--primary-glow);
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .obd-btn:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -8px rgba(13, 110, 253, 0.6);
        }
        .obd-btn i { transition: transform 0.3s var(--ease); }
        .obd-btn:hover i { transform: translateX(4px); }

        @media (max-width: 991.98px) {
            .home-hero { grid-template-columns: 1fr; padding: 30px 28px; }
            .home-car { display: none; }
            .symptom-grid { grid-template-columns: 1fr; }
            .obd-banner { flex-direction: column; align-items: flex-start; }
        }

        @media (max-width: 575.98px) {
            .obd-info { flex-direction: column; align-items: flex-start; }
            .obd-btn { width: 100%; justify-content: center; }
        }

        /* ---------- ANIMACIONES ---------- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 991.98px) {
            .main-content { padding: 24px 20px; }
            .about-wrap { min-height: 0; }
            .about-card { grid-template-columns: 1fr; }
            .about-brand { padding: 40px 28px; }
            .about-info { padding: 32px 28px 24px; }
        }

        @media (max-width: 767.98px) {
            body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
            .sidebar { width: 100%; }
            .sidebar-brand { padding: 16px 18px; }
            .brand-icon { width: 40px; height: 40px; font-size: 1.3rem; }
            .sidebar-menu { flex-direction: row; overflow-x: auto; padding: 10px 12px; gap: 6px; }
            .menu-label, .sidebar-footer { display: none; }
