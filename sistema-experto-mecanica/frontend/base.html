<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecánica Experta | Sistema Experto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: #0b192c; color: white; display: flex; flex-direction: column; }
        .sidebar-brand { padding: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .nav-link { color: #a0aec0; padding: 12px 20px; display: flex; align-items: center; gap: 15px; text-decoration: none; transition: all 0.3s; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #1a2c42; border-left: 4px solid #0d6efd; }
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body>
    <!-- BARRA LATERAL -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-gear-wide-connected fs-3"></i>
            <div>
                MECÁNICA EXPERTA<br>
                <small class="text-muted" style="font-size: 0.7rem;">Sistema experto de mecánica</small>
            </div>
        </div>
        <div class="nav flex-column mt-3">
            <div class="nav flex-column mt-3">
            <a href="{{ url_for('inicio') }}" class="nav-link {% if request.endpoint == 'inicio' %}active{% endif %}">
                <i class="bi bi-house-door"></i> Inicio
            </a>
            <!-- NUEVO BOTÓN EN EL MENÚ LATERAL PARA EL CHATBOT OBD-II -->
            <a href="{{ url_for('chatbot') }}" class="nav-link {% if request.endpoint == 'chatbot' %}active{% endif %}">
                <i class="bi bi-robot"></i> Escáner OBD-II
            </a>
            <a href="{{ url_for('historial') }}" class="nav-link {% if request.endpoint == 'historial' %}active{% endif %}">
                <i class="bi bi-journal-text"></i> Historial
            </a>
            <a href="{{ url_for('consejos') }}" class="nav-link {% if request.endpoint == 'consejos' %}active{% endif %}">
                <i class="bi bi-lightbulb"></i> Consejos
            </a>
            <a href="{{ url_for('acerca') }}" class="nav-link {% if request.endpoint == 'acerca' %}active{% endif %}">
                <i class="bi bi-info-circle"></i> Acerca de
            </a>
        </div>
    </nav>

    <!-- ÁREA DINÁMICA: Aquí se inyectará el contenido de las otras páginas -->
    <main class="main-content">
        {% block contenido %}{% endblock %}
    </main>

</body>
</html>
